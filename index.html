<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparkle House</title>
<meta name="description" content="Snap a messy room, get a chore list, earn sparkles as you clean.">
<meta name="theme-color" content="#7FCF9A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sparkle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --grass:#7FCF9A;
  --meadow:#E6F5EA;
  --leaf:#2F6B4F;
  --leaf-dark:#22513B;
  --ink:#2D3B36;
  --ink-soft:#5D6D66;
  --paper:#FFFFFF;
  --sun:#FFD447;
  --sun-soft:#FFF4C4;
  --berry:#FF6F8E;
  --sky:#8AD3F0;
  --dust:#C9CED6;
  --line:#CFE6D6;
  --ledge:#B9DCC4;
  --bubble:#FFFCEF;
  --bubble-edge:#EADFAE;
  --display:'Baloo 2', ui-rounded, system-ui, sans-serif;
  --body:'Nunito', ui-rounded, system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.45;
  background-color:var(--meadow);
  background-image:radial-gradient(#D3EDDA 2px, transparent 2.5px),radial-gradient(#D3EDDA 2px, transparent 2.5px);
  background-size:36px 36px;background-position:0 0,18px 18px;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 96px)}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.who{display:flex;align-items:center;gap:8px;background:var(--paper);border:0;border-radius:999px;padding:5px 14px 5px 5px;box-shadow:0 3px 0 var(--ledge);font-weight:800}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:17px;flex:none}
.spark-pill{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--sun);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 3px 0 #E2B321}
.spark-pill .star{width:18px;height:18px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;box-shadow:0 3px 0 var(--ledge);flex:none}
.icon-btn svg{width:22px;height:22px}

/* Fluff + dialog */
.fluff{width:64px;height:64px;flex:none}
.fluff.lg{width:96px;height:96px}
.fluff .eye-closed{display:none}
.fluff.happy .eye-open{display:none}
.fluff.happy .eye-closed{display:inline}
.dialog{position:relative;background:var(--bubble);border:3px solid var(--bubble-edge);border-radius:26px;padding:18px 18px 16px;font-weight:700;font-size:17px}
.dialog .tag{position:absolute;top:-14px;left:18px;background:var(--sun);font-family:var(--display);font-weight:800;font-size:15px;padding:0 12px;border-radius:999px;line-height:26px}
.speaker{display:flex;align-items:flex-end;gap:10px}
.speaker .dialog{flex:1}
.caret{display:inline-block;width:8px;height:8px;margin-left:6px;border-right:3px solid var(--leaf);border-bottom:3px solid var(--leaf);transform:rotate(45deg) translateY(-3px);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(45deg) translate(2px,-1px)}}

/* panels */
.panel{background:var(--paper);border-radius:22px;box-shadow:0 4px 0 var(--ledge);padding:16px}
.stats{display:flex;gap:8px;margin:18px 0 22px}
.stat{flex:1;background:var(--paper);border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--ledge)}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-soft);font-weight:700}
.section-title{font-size:22px;margin:0 0 10px 4px}

/* rooms */
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.room{position:relative;text-align:left;border:0;background:var(--paper);border-radius:22px;padding:14px 14px 12px;box-shadow:0 4px 0 var(--ledge);display:flex;flex-direction:column;gap:6px;min-height:128px;transition:transform .08s}
.room:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ledge)}
.room .emo{font-size:34px;line-height:1}
.room .nm{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.room .badge{position:absolute;top:10px;right:10px;background:var(--berry);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:2px 9px}
.room.add{background:transparent;border:3px dashed var(--ledge);box-shadow:none;align-items:center;justify-content:center;color:var(--leaf);font-weight:800}
.pips{display:flex;gap:3px;margin-top:auto}
.pips svg{width:17px;height:17px}
.shine-note{font-size:13px;font-weight:700;color:var(--ink-soft)}
.shine-note.low{color:#C2405E}

/* room view */
.back{display:flex;align-items:center;gap:6px;border:0;background:none;font-weight:800;color:var(--leaf);padding:6px 0;margin-bottom:6px}
.room-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.room-head .emo{font-size:40px}
.room-head h1{font-size:32px}
.photo{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 4px 0 var(--ledge);background:#dfe9e2;margin-bottom:16px}
.photo img{display:block;width:100%;height:auto}
.zones{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.zone{position:relative;display:grid;place-items:center;border-radius:16px;margin:4px;transition:background .2s, box-shadow .2s}
.zone.hot{background:rgba(255,212,71,.28);box-shadow:inset 0 0 0 3px var(--sun)}
.zone .mk{border:0;min-width:34px;height:34px;border-radius:999px;background:var(--berry);color:#fff;font-weight:800;font-family:var(--display);font-size:17px;box-shadow:0 3px 0 #C2405E;padding:0 8px}
.no-photo{display:flex;gap:12px;align-items:center;margin-bottom:16px;font-weight:700;font-size:15px;color:var(--ink-soft)}
.progress{margin:18px 0 10px;display:flex;align-items:center;gap:12px;font-weight:800}
.bar{flex:1;height:14px;border-radius:999px;background:#DCEFE2;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),#55B97C);border-radius:999px;transition:width .4s}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:12px 12px 12px 10px;box-shadow:0 3px 0 var(--ledge);border:3px solid transparent;cursor:pointer}
.task.sel{border-color:var(--sun);flex-wrap:wrap}
.task-actions{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 0 50px}
.task-actions .btn{flex:0 1 auto;padding:8px 16px;font-size:15px;box-shadow:0 3px 0 var(--ledge);background:var(--meadow)}
.task-actions .btn.danger{color:#C2405E}
.edit-hint{text-align:center;font-size:14px;font-weight:700;color:var(--ink-soft);margin:10px 0 0}
.tick{width:38px;height:38px;flex:none;border-radius:50%;border:3px solid var(--grass);background:#fff;display:grid;place-items:center;padding:0}
.tick svg{width:20px;height:20px;opacity:0}
.task.done .tick{background:var(--grass)}
.task.done .tick svg{opacity:1}
.tbody{flex:1;min-width:0}
.ttl{font-weight:800;line-height:1.25}
.task.done .ttl{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-soft)}
.tdet{font-size:14px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.tmeta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.pts{background:var(--sun-soft);border-radius:999px;padding:1px 9px;font-family:var(--display);font-weight:800;font-size:15px}
.min{font-size:12px;color:var(--ink-soft);font-weight:700}
.by{font-size:12px;font-weight:800;color:var(--leaf)}

.actions{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(var(--safe-b) + 12px);background:linear-gradient(transparent, var(--meadow) 28%);z-index:20}
.actions .inner{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.btn{border:0;border-radius:999px;padding:14px 18px;font-weight:800;font-size:17px;background:var(--paper);box-shadow:0 4px 0 var(--ledge);display:flex;align-items:center;justify-content:center;gap:8px;flex:1;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ledge)}
.btn.primary{background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-dark)}
.btn.primary:active{box-shadow:0 1px 0 var(--leaf-dark)}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 #E2B321}
.btn.small{padding:9px 14px;font-size:15px;flex:0 1 auto}
.btn.text{background:none;box-shadow:none;color:var(--leaf);padding:8px 10px;font-size:15px}
.btn[disabled]{opacity:.5}
.btn svg{width:20px;height:20px}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:22px 8px}
.empty .dialog{text-align:left}
.demo-note{font-size:14px;font-weight:700;color:var(--ink-soft);text-align:center;margin-top:10px}
.demo-note b{color:var(--leaf)}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 12px);display:flex;gap:6px;background:var(--paper);border-radius:999px;padding:6px;box-shadow:0 4px 0 var(--ledge);z-index:15}
.tab{border:0;background:none;border-radius:999px;padding:10px 20px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--ink-soft)}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{background:var(--grass);color:var(--ink)}

/* rewards */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.decor{background:var(--paper);border-radius:18px;padding:12px 6px 10px;text-align:center;box-shadow:0 3px 0 var(--ledge)}
.decor .e{font-size:38px;line-height:1.1;display:block}
.decor .n{font-weight:800;font-size:13px;line-height:1.2;display:block;margin-top:4px}
.decor .c{font-size:12px;font-weight:700;color:var(--ink-soft)}
.decor.locked .e{filter:grayscale(1) brightness(.4);opacity:.35}
.decor.locked{background:#F3FAF5;box-shadow:0 3px 0 #DCEDE1}
.next{margin:4px 0 14px 4px;font-weight:700;color:var(--ink-soft)}
.board{list-style:none;margin:0;padding:0}
.board li{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:800}
.board li + li{border-top:2px dashed var(--line)}
.board .sc{margin-left:auto;font-family:var(--display);font-size:20px}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{display:flex;gap:8px;padding:6px 0;font-weight:600}
.log li span:last-child{margin-left:auto;font-weight:800;white-space:nowrap}
.mt{margin-top:22px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;background:rgba(45,59,54,.35);z-index:76;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--meadow);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(var(--safe-b) + 22px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:26px;margin-bottom:12px}
.sheet h3{font-size:19px;margin:20px 0 8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-weight:800;font-size:15px}
.field input,.field select{font:inherit;font-weight:700;font-size:16px;border:3px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;color:var(--ink)}
.field small{font-weight:600;color:var(--ink-soft)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:800}
.toggle input{width:24px;height:24px;accent-color:var(--leaf)}
.plist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 10px;font-weight:800}
.plist li.cur{box-shadow:inset 0 0 0 3px var(--grass)}
.plist li button.pick{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;font-weight:800;padding:0}
.persona-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.persona{border:3px solid transparent;background:#fff;border-radius:18px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--ledge);text-align:center}
.persona .fluff{width:62px;height:62px}
.persona b{font-family:var(--display);font-size:18px;line-height:1.1}
.persona span{font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.25}
.persona[aria-pressed="true"]{border-color:var(--grass);background:#F2FBF5}
.persona-hello{margin:10px 0 0;font-weight:700;font-style:italic;color:var(--ink-soft);min-height:1.4em}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{border:3px solid transparent;background:#fff;border-radius:12px;font-size:26px;width:48px;height:48px;padding:0}
.emoji-pick button[aria-pressed="true"]{border-color:var(--grass)}
.status{font-weight:800;font-size:14px;padding:8px 12px;border-radius:12px;background:#fff;margin-top:6px}
.status.ok{color:var(--leaf)}
.status.bad{color:#C2405E}

/* toast + pops */
.flash-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 8px);z-index:88;background:var(--sun);color:var(--ink);font-weight:800;border-radius:999px;padding:7px 16px;box-shadow:0 4px 0 #E2B321;white-space:nowrap;font-variant-numeric:tabular-nums}
.app.has-flash{padding-top:calc(var(--safe-t) + 54px)}
.app.has-flash ~ .toasts{top:calc(var(--safe-t) + 58px)}
.toasts{position:fixed;top:calc(var(--safe-t) + 12px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-weight:800;border-radius:16px;padding:10px 16px;max-width:92vw;animation:tin .25s ease-out;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.toast.win{background:var(--sun);color:var(--ink)}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
.pop{position:fixed;left:50%;top:42%;transform:translate(-50%,0);font-family:var(--display);font-weight:800;font-size:46px;color:var(--ink);background:var(--sun);border-radius:999px;padding:4px 22px;box-shadow:0 5px 0 #E2B321;z-index:95;pointer-events:none;animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,20px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.08);opacity:1}30%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-70px);opacity:0}}

/* busy overlay */
.busy{position:fixed;inset:0;z-index:80;background:rgba(230,245,234,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.busy .fluff{animation:hop .8s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-12px)}}
.busy p{font-family:var(--display);font-size:22px;font-weight:700;margin:0;text-align:center}

/* coach mode */
.coach{position:fixed;inset:0;z-index:70;background:#1d2a25;color:#fff;display:flex;flex-direction:column}
.coach .cam{position:absolute;inset:0}
.coach .cam.mirror{transform:scaleX(-1)}
.coach video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.area-ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.zone.ask{background:rgba(138,211,240,.32);box-shadow:inset 0 0 0 3px var(--sky)}
/* focus area editor */
.area-ed{position:fixed;inset:0;z-index:82;background:#1d2a25;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 12px) 14px calc(var(--safe-b) + 14px);gap:10px}
.area-ed .tip{background:var(--bubble);border:3px solid var(--bubble-edge);border-radius:20px;padding:10px 14px;font-weight:700;color:var(--ink)}
.area-ed svg{flex:1;min-height:0;width:100%;touch-action:none;cursor:crosshair}
.area-ed .row .btn{padding:12px 10px;font-size:15px}
/* ask */
.ask-input{display:flex;gap:8px;align-items:center}
.ask-input input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:16px;border:3px solid var(--line);border-radius:14px;padding:12px;background:#fff;color:var(--ink)}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 var(--ledge);display:grid;place-items:center;flex:none}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--berry);color:#fff;box-shadow:0 3px 0 #C2405E;animation:blink 1s infinite}
.ask-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.ask-chips button{border:0;background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--ledge)}
.ask-answer{margin:14px 0}
.coach .chip{padding:7px 10px;font-size:15px;gap:6px}
.ch-banner{position:relative;margin:12px auto 0;width:max-content;max-width:calc(100% - 28px);background:var(--sun);color:var(--ink);border-radius:22px;padding:6px 22px 8px;text-align:center;box-shadow:0 5px 0 #E2B321}
.ch-time{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums}
.ch-label{font-weight:800;font-size:14px;max-width:280px}
.ch-banner.hurry .ch-time{color:#C2405E;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.dur-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.dur-grid .btn{padding:12px 8px}
.custom-time{display:flex;gap:8px;align-items:center}
.custom-time input,.custom-time select{font:inherit;font-weight:700;font-size:16px;border:3px solid var(--line);border-radius:14px;padding:10px;background:#fff;color:var(--ink);min-width:0}
.custom-time input{width:80px}
.chip.flip{padding:7px 9px}
.chip.flip svg{width:20px;height:20px}
.coach .hud{position:relative;display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 10px) 14px 0}
.chip{background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:800;display:flex;align-items:center;gap:8px;border:0}
.chip .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--grass)}
.chip .dot.moving{background:var(--sun)}
.chip .dot.checking{background:var(--sky);animation:blink .7s infinite}
@keyframes blink{50%{opacity:.3}}
.chip.status{min-width:0;flex:0 1 auto;display:inline-flex}
.coach .hud2{position:relative;padding:8px 14px 0}
.coach .bottom .row .btn{font-size:16px;padding:13px 8px}
.chip.status span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.timer{margin-left:auto;flex:none}
.chip.score{flex:none}
.chip .star{width:16px;height:16px;flex:none}
.chip.score{font-family:var(--display);font-size:18px;background:var(--sun)}
.coach .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(var(--safe-b) + 14px);color:var(--ink)}
.coach .speaker .dialog{min-height:84px}
.coach .fluff{filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.coach-tasks{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;scrollbar-width:none}
.coach-tasks::-webkit-scrollbar{display:none}
.ctask{flex:none;max-width:220px;background:rgba(255,255,255,.94);border:0;border-radius:14px;padding:8px 12px;text-align:left;font-weight:800;font-size:14px;line-height:1.25;display:flex;gap:8px;align-items:center}
.ctask .pts{font-size:13px}
.ctask.done{opacity:.55;text-decoration:line-through}
.coach .row .btn{box-shadow:0 4px 0 rgba(0,0,0,.25)}
.timer{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

const PLAYER_COLORS = ['#FF8FA3', '#5BB8EA', '#F2B321', '#A98BEB', '#4FBF7E', '#FF9B5A'];
const ROOM_EMOJI = ['🍳', '🛋️', '🛏️', '🛁', '🧺', '🧸', '💻', '🚗', '🌿', '🍽️', '📚', '🎮'];
const ZONES = ['top-left', 'top', 'top-right', 'left', 'center', 'right', 'bottom-left', 'bottom', 'bottom-right'];
const DECOR = [
  { id: 'fern', e: '🪴', n: 'Potted fern', c: 40 },
  { id: 'basket', e: '🧺', n: 'Woven basket', c: 100 },
  { id: 'lamp', e: '💡', n: 'Cozy lamp', c: 180 },
  { id: 'clock', e: '🕰️', n: 'Mantel clock', c: 280 },
  { id: 'books', e: '📚', n: 'Book stack', c: 400 },
  { id: 'tank', e: '🐠', n: 'Fish tank', c: 550 },
  { id: 'chime', e: '🎐', n: 'Wind chime', c: 720 },
  { id: 'piano', e: '🎹', n: 'Little piano', c: 950 },
  { id: 'globe', e: '🌍', n: 'Desk globe', c: 1200 },
  { id: 'tree', e: '🌳', n: 'Indoor tree', c: 1500 },
  { id: 'rug', e: '🌈', n: 'Rainbow rug', c: 2000 },
  { id: 'fort', e: '⛺', n: 'Blanket fort', c: 2600 }
];

/* ---------- state ---------- */
const STORE_KEY = 'sparklehouse.v1';
const fresh = () => ({
  players: [], current: null,
  rooms: [
    { id: 'kitchen', name: 'Kitchen', emoji: '🍳', shine: 45, shineAt: Date.now(), created: 1 },
    { id: 'living', name: 'Living room', emoji: '🛋️', shine: 60, shineAt: Date.now(), created: 2 },
    { id: 'bedroom', name: 'Bedroom', emoji: '🛏️', shine: 35, shineAt: Date.now(), created: 3 },
    { id: 'bathroom', name: 'Bathroom', emoji: '🛁', shine: 50, shineAt: Date.now(), created: 4 }
  ],
  sessions: {},
  settings: { workerUrl: '', token: '', sound: true, voice: false, voiceId: '', minGap: 20, camera: 'environment', pep: 'light' },
  household: { lifetime: 0 },
  unlocked: [],
  streak: { count: 0, last: '' },
  history: [],
  coachTipSeen: false,
  deviceId: '',
  notify: { on: false, daily: '17:30', streak: true, weekly: true, flash: true, quietStart: '21:00', quietEnd: '08:00' },
  flashUntil: 0,
  schema: 2
});
function load() {
  const base = fresh();
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const s = Object.assign(base, parsed);
      s.schema = parsed.schema || 1;
      s.settings = Object.assign(fresh().settings, s.settings || {});
      s.notify = Object.assign(fresh().notify, s.notify || {});
      return migrate(s);
    }
  } catch (e) { /* storage blocked */ }
  return base;
}
// Version 2: sparkle totals, streak and decor are worked out from the history of sparkle events,
// so phones can share one household without overwriting each other's points.
function migrate(s) {
  if ((s.schema || 1) >= 2) return s;
  s.history = (s.history || []).map((h) => ({ id: h.id || uid() + uid(), ...h }));
  const by = {}; let total = 0;
  s.history.forEach((h) => { by[h.player] = (by[h.player] || 0) + h.pts; total += h.pts; });
  (s.players || []).forEach((p, i) => {
    p.created = p.created || i + 1;
    const diff = (p.sparkles || 0) - (by[p.id] || 0);
    if (diff > 0) { s.history.push({ id: uid() + uid(), ts: 1, room: '', title: 'Earlier sparkles', pts: diff, player: p.id, task: 'carry' }); total += diff; }
  });
  const rest = ((s.household && s.household.lifetime) || 0) - total;
  if (rest > 0) s.history.push({ id: uid() + uid(), ts: 1, room: '', title: 'Earlier household sparkles', pts: rest, player: '', task: 'carry' });
  (s.rooms || []).forEach((r, i) => { r.created = r.created || i + 1; });
  s.schema = 2;
  return s;
}
let S = load();
recompute();
function addEvent(e) { e.id = e.id || uid() + uid(); S.history.unshift(e); return e; }
function recompute() {
  const by = {}; let total = 0;
  for (const h of S.history) { total += h.pts; by[h.player] = (by[h.player] || 0) + h.pts; }
  S.players.forEach((p) => { p.sparkles = by[p.id] || 0; });
  S.household.lifetime = total;
  S.unlocked = DECOR.filter((d) => total >= d.c).map((d) => d.id);
  // Streak: days in a row (household) with at least one finished chore, counting back from the latest.
  const real = S.history.filter((h) => h.task !== 'carry' && h.ts > 1);
  if (!real.length) { S.streak = { count: 0, last: '' }; return; }
  const days = new Set(real.map((h) => dayKey(h.ts)));
  const latest = real.reduce((a, h) => Math.max(a, h.ts), 0);
  const d = new Date(latest); d.setHours(12, 0, 0, 0);
  let count = 0;
  while (days.has(dayKey(d.getTime()))) { count++; d.setDate(d.getDate() - 1); }
  S.streak = { count, last: dayKey(latest) };
}
function storeLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
function save() {
  recompute();
  storeLocal();
  if (typeof afterSave === 'function') afterSave();
}

// Photos live only in memory, never in storage.
const mem = { before: {}, selected: null, lastFeedback: {} };
let ui = { view: 'home', roomId: null };

const player = () => S.players.find((p) => p.id === S.current) || S.players[0];
const roomById = (id) => S.rooms.find((r) => r.id === id);
const shineOf = (r) => Math.max(0, Math.round(r.shine - ((Date.now() - r.shineAt) / 864e5) * 12));
function setShine(r, v) { r.shine = clamp(Math.round(v), 0, 100); r.shineAt = Date.now(); }

/* ---------- art ---------- */
const FLUFF_GEAR = {
  // Sunny: a little bow
  sunny: { top: '<g transform="translate(67 23) rotate(18)"><path d="M0 0L-11-8L-11 8Z M0 0L11-8L11 8Z" fill="#FFD447" stroke="#E2B321" stroke-width="1.6" stroke-linejoin="round"/><circle r="3.4" fill="#FF8FA3"/></g>' },
  // Sarge: an army cap with a star
  sarge: { top: '<path d="M25 31Q50 5 75 31Z" fill="#6B8E4E"/><path d="M19 31Q50 25 83 32L84 37Q50 30 17 36Z" fill="#4E6B38"/><path d="M50 15l1.6 3.4 3.7.4-2.8 2.5.8 3.6L50 23l-3.3 1.9.8-3.6-2.8-2.5 3.7-.4z" fill="#FFD447"/>' },
  // Snooze: a nightcap and sleepy eyelids
  snooze: { top: '<path d="M27 30Q40 4 72 9Q68 20 76 31Z" fill="#8AA8E6"/><circle cx="73" cy="9" r="5.5" fill="#fff"/><path d="M24 31Q51 23 78 31L78 36Q51 28 24 35Z" fill="#fff"/>',
    face: '<g class="eye-open"><path d="M36.5 48.5h9.5v4.6h-9.5z M54.5 48.5h9.5v4.6h-9.5z" fill="#E3E7EC"/><path d="M36.6 53h9 M54.6 53h9" stroke="#2D3B36" stroke-width="1.6" stroke-linecap="round"/></g>' },
  // Captain: a pirate hat and eye patch
  captain: { top: '<path d="M16 31Q28 9 50 13Q72 9 84 31Q67 24 50 27Q33 24 16 31Z" fill="#2D3B36"/><circle cx="50" cy="20.5" r="3.4" fill="#fff"/><path d="M47.6 24.5h4.8" stroke="#fff" stroke-width="1.4"/>',
    face: '<path d="M33 41L70 58" stroke="#2D3B36" stroke-width="1.7"/><ellipse cx="59" cy="53" rx="6" ry="5.4" fill="#2D3B36"/>' }
};
function fluffSVG(cls = '', persona = personaId()) {
  const gear = FLUFF_GEAR[persona] || {};
  let bumps = '';
  for (let k = 0; k < 12; k++) {
    const a = (k * Math.PI) / 6;
    bumps += `<circle cx="${(50 + Math.cos(a) * 27.5).toFixed(1)}" cy="${(54 + Math.sin(a) * 27.5).toFixed(1)}" r="10.5"/>`;
  }
  return `<svg class="fluff ${cls}" viewBox="0 0 100 100" aria-hidden="true">
    <g fill="#C9CED6">${bumps}<circle cx="50" cy="54" r="29"/></g>
    <circle cx="46.5" cy="50" r="22.5" fill="#E3E7EC"/>
    <g class="eye-open"><circle cx="41" cy="53" r="4" fill="#2D3B36"/><circle cx="59" cy="53" r="4" fill="#2D3B36"/><circle cx="39.6" cy="51.6" r="1.4" fill="#fff"/><circle cx="57.6" cy="51.6" r="1.4" fill="#fff"/></g>
    <g class="eye-closed" fill="none" stroke="#2D3B36" stroke-width="2.6" stroke-linecap="round"><path d="M37 54q4-5 8 0"/><path d="M55 54q4-5 8 0"/></g>
    <ellipse cx="34.5" cy="61.5" rx="4.6" ry="2.6" fill="#FFA9B8"/><ellipse cx="65.5" cy="61.5" rx="4.6" ry="2.6" fill="#FFA9B8"/>
    <path d="M46 60q4 4 8 0" fill="none" stroke="#2D3B36" stroke-width="2.2" stroke-linecap="round"/>
    ${gear.face || ''}${gear.top || ''}
  </svg>`;
}
const STAR = (fill = '#2D3B36') => `<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="${fill}" d="M12 1.5l2.3 7.2 7.2 2.3-7.2 2.3L12 20.5l-2.3-7.2L2.5 11l7.2-2.3z"/></svg>`;
const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const ICON = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'
};
function pips(v) {
  const n = Math.ceil(v / 20);
  let h = '';
  for (let i = 0; i < 5; i++) h += STAR(i < n ? '#F2B321' : '#DDE8E0');
  return `<div class="pips" aria-label="${v}% sparkly">${h}</div>`;
}
const avatar = (p, size = 32) => p ? `<span class="avatar" style="background:${p.color};width:${size}px;height:${size}px">${esc(p.name.slice(0, 1).toUpperCase())}</span>` : '';

/* ---------- feedback: toasts, pops, sound, voice ---------- */
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function pop(text) {
  const p = document.createElement('div');
  p.className = 'pop'; p.textContent = text;
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 1500);
}
let actx = null;
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) { actx = null; }
}
function chime() {
  if (!S.settings.sound || !actx) return;
  const t = actx.currentTime;
  [[784, 0], [1175, 0.09], [1568, 0.18]].forEach(([f, dt]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t + dt);
    g.gain.linearRampToValueAtTime(0.16, t + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dt + 0.5);
    o.connect(g).connect(actx.destination);
    o.start(t + dt); o.stop(t + dt + 0.55);
  });
}
/* Voices: the phone's downloadable Enhanced/Premium voices sound far more natural,
   so pick one of those when it's installed, unless the person chose a voice. */
const hasSpeech = 'speechSynthesis' in window;
function voiceQuality(v) {
  const id = (v.voiceURI + ' ' + v.name).toLowerCase();
  if (id.includes('premium')) return 3;
  if (id.includes('enhanced')) return 2;
  return v.localService ? 1 : 0;
}
function englishVoices() {
  if (!hasSpeech) return [];
  return speechSynthesis.getVoices()
    .filter((v) => /^en([-_]|$)/i.test(v.lang))
    .sort((a, b) => voiceQuality(b) - voiceQuality(a) || (b.lang === 'en-US') - (a.lang === 'en-US') || a.name.localeCompare(b.name));
}
function pickVoice(id = S.settings.voiceId) {
  const list = englishVoices();
  return list.find((v) => v.voiceURI === id) || list[0] || null;
}
function voiceLabel(v) {
  const q = voiceQuality(v);
  return `${v.name.replace(/\s*\((premium|enhanced)\)/i, '')}${q === 3 ? ' (Premium)' : q === 2 ? ' (Enhanced)' : ''}, ${v.lang}`;
}
if (hasSpeech) { speechSynthesis.getVoices(); speechSynthesis.addEventListener('voiceschanged', () => speechSynthesis.getVoices()); }
function sayOnPhone(text, voiceId) {
  if (!hasSpeech || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(voiceId);
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = 1.0; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
}

/* AI voices (ElevenLabs, through the helper). Voice ids saved as "el:<id>";
   anything else is a voice on this phone. Lines are cached on the phone so
   repeated ones never cost credits twice. */
const AI = { voices: [], loaded: false, failedNote: false, source: null, token: 0 };
async function loadAiVoices() {
  if (!api.live) { AI.voices = []; AI.loaded = true; return; }
  try { AI.voices = (await api.voices()).voices || []; } catch (e) { AI.voices = []; }
  AI.loaded = true;
}
function currentVoiceId() {
  const id = S.settings.voiceId || '';
  if (id.startsWith('el:')) return AI.voices.some((v) => 'el:' + v.id === id) || !AI.loaded ? id : defaultVoiceId();
  return id || defaultVoiceId();
}
function defaultVoiceId() {
  const mine = AI.voices.find((v) => v.category && v.category !== 'premade') || AI.voices[0];
  if (mine) return 'el:' + mine.id;
  const v = pickVoice(''); return v ? v.voiceURI : '';
}
function cleanForSpeech(t) { return String(t).replace(/[\u2726\u2728]/g, '').replace(/\s+/g, ' ').trim(); }
async function voiceCacheKey(voice, text) {
  const data = new TextEncoder().encode(voice + '|' + text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return 'voice-cache/' + [...new Uint8Array(hash)].slice(0, 12).map((b) => b.toString(16).padStart(2, '0')).join('') + '.mp3';
}
async function aiAudio(voice, text) {
  let key = null, cache = null;
  try { if ('caches' in window && crypto.subtle) { cache = await caches.open('sparkle-voice-v1'); key = await voiceCacheKey(voice, text); const hit = await cache.match(key); if (hit) return hit.arrayBuffer(); } } catch (e) { cache = null; }
  const buf = await api.speak(text, voice);
  if (cache && key) { try { await cache.put(key, new Response(buf.slice(0), { headers: { 'Content-Type': 'audio/mpeg' } })); } catch (e) { /* storage full */ } }
  return buf;
}
async function playBuffer(buf, my) {
  if (!actx) unlockAudio();
  if (!actx) throw new Error('no audio');
  const audio = await actx.decodeAudioData(buf.slice(0));
  if (my !== AI.token) return;
  if (AI.source) { try { AI.source.stop(); } catch (e) { /* already stopped */ } }
  const src = actx.createBufferSource();
  src.buffer = audio; src.connect(actx.destination); src.start();
  AI.source = src;
}
async function say(text, voiceId = currentVoiceId()) {
  text = cleanForSpeech(text);
  if (!text) return;
  const my = ++AI.token;
  if (AI.source) { try { AI.source.stop(); } catch (e) { /* ignore */ } }
  if (hasSpeech) speechSynthesis.cancel();
  if (voiceId && voiceId.startsWith('el:') && api.live) {
    try { await playBuffer(await aiAudio(voiceId.slice(3), text), my); return; }
    catch (e) {
      if (!AI.failedNote) { AI.failedNote = true; toast((e.message || 'Fluff\'s AI voice isn\'t available') + ' Using the phone\'s voice instead.'); }
      if (my !== AI.token) return;
      voiceId = '';
    }
  }
  sayOnPhone(text, voiceId && !voiceId.startsWith('el:') ? voiceId : '');
}
function speak(text) { if (S.settings.voice) say(text); }
let typeToken = 0;
const typed = {};
function typeInto(el, text) {
  if (!el) return;
  const my = ++typeToken;
  const key = el.id || 'x';
  const repeat = typed[key] === text;
  typed[key] = text;
  if (reduceMotion || repeat) { el.innerHTML = esc(text) + '<span class="caret"></span>'; return; }
  el.textContent = '';
  let i = 0;
  const step = () => {
    if (my !== typeToken) return;
    i += 2;
    el.textContent = text.slice(0, i);
    if (i < text.length) setTimeout(step, 24);
    else el.innerHTML = esc(text) + '<span class="caret"></span>';
  };
  step();
}

/* ---------- scoring ---------- */
function checkUnlocks() {
  DECOR.forEach((d) => {
    if (S.household.lifetime >= d.c && !S.unlocked.includes(d.id)) {
      S.unlocked.push(d.id);
      (mem.newUnlocks = mem.newUnlocks || []).push(d);
      toast(`Unlocked: ${d.e} ${d.n}`, 'win');
    }
  });
}
function awardTask(roomId, task, how) {
  if (task.done) return 0;
  const p = player();
  const sess = S.sessions[roomId];
  const room = roomById(roomId);
  task.done = true; task.how = how; task.doneAt = Date.now(); task.by = p.id;
  let gained = task.points;
  p.sparkles += task.points;
  S.household.lifetime += task.points;
  const total = sess.tasks.reduce((a, t) => a + t.points, 0) || 1;
  setShine(room, shineOf(room) + (100 * task.points) / total);
  addEvent({ ts: task.doneAt, room: room.name, title: task.title, pts: task.points, player: p.id, task: task.id });
  if (Date.now() < (S.flashUntil || 0)) {
    task.flash = true;
    p.sparkles += task.points; S.household.lifetime += task.points; gained += task.points;
    addEvent({ ts: task.doneAt, room: room.name, title: 'Flash bonus', pts: task.points, player: p.id, task: task.id + ':flash' });
  }
  if (sess.tasks.every((t) => t.done) && !sess.sweep) {
    sess.sweep = true;
    p.sparkles += 10; S.household.lifetime += 10; gained += 10;
    setShine(room, 100);
    addEvent({ ts: Date.now(), room: room.name, title: 'Clean sweep bonus', pts: 10, player: p.id, task: sweepKey(roomId) });
    setTimeout(() => toast('Clean sweep! +10 bonus sparkles', 'win'), 900);
  }
  checkUnlocks();
  save();
  return gained;
}
const sweepKey = (roomId) => `sweep:${roomId}:${(S.sessions[roomId] && S.sessions[roomId].createdAt) || 0}`;
function awardBonus(roomId, pts, title) {
  const p = player();
  const room = roomById(roomId);
  p.sparkles += pts; S.household.lifetime += pts;
  addEvent({ ts: Date.now(), room: room ? room.name : '', title, pts, player: p.id, task: 'bonus' });
  checkUnlocks(); save();
  return pts;
}
function undoTask(roomId, task) {
  const sess = S.sessions[roomId];
  const room = roomById(roomId);
  const p = S.players.find((x) => x.id === task.by) || player();
  const total = sess.tasks.reduce((a, t) => a + t.points, 0) || 1;
  const back = task.points * (task.flash ? 2 : 1);
  p.sparkles = Math.max(0, p.sparkles - back);
  S.household.lifetime = Math.max(0, S.household.lifetime - back);
  setShine(room, shineOf(room) - (100 * task.points) / total);
  S.history = S.history.filter((h) => h.task !== task.id && h.task !== task.id + ':flash');
  delete task.flash;
  if (sess.sweep) {
    sess.sweep = false;
    const key = sweepKey(roomId);
    const i = S.history.findIndex((h) => h.task === key || (h.task === 'sweep' && h.room === room.name));
    if (i > -1) S.history.splice(i, 1);
  }
  task.done = false; delete task.how; delete task.doneAt; delete task.by;
  save();
}
function applyVerify(roomId, res, how) {
  const sess = S.sessions[roomId];
  let count = 0, pts = 0;
  (res.done || []).forEach((id) => {
    const t = sess.tasks.find((x) => x.id === id && !x.done);
    if (t) { pts += awardTask(roomId, t, how); count++; }
  });
  return { count, pts };
}

/* ---------- images ---------- */
function loadImage(src) {
  return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
}
function toJpeg(source, w, h, max, q, area = null) {
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  const ctx = c.getContext('2d');
  ctx.drawImage(source, 0, 0, c.width, c.height);
  if (area && area.length >= 3) {
    // Gray out everything outside the focus area so the AI ignores it.
    ctx.fillStyle = '#808080';
    ctx.beginPath();
    ctx.rect(0, 0, c.width, c.height);
    area.forEach(([x, y], i) => (i ? ctx.lineTo(x * c.width, y * c.height) : ctx.moveTo(x * c.width, y * c.height)));
    ctx.closePath();
    ctx.fill('evenodd');
  }
  const dataUrl = c.toDataURL('image/jpeg', q);
  return { dataUrl, b64: dataUrl.split(',')[1] };
}
function areaPath(area, w = 1, h = 1) {
  return area && area.length >= 3 ? 'M' + area.map(([x, y]) => `${(x * w).toFixed(4)},${(y * h).toFixed(4)}`).join('L') + 'Z' : '';
}
function areaOverlaySVG(area, w = 1, h = 1, extra = '') {
  const inner = areaPath(area, w, h);
  return (inner ? `<path d="M0,0H${w}V${h}H0Z ${inner}" fill="rgba(20,28,25,.55)" fill-rule="evenodd"/><path d="${inner}" fill="none" stroke="#FFD447" stroke-width="3" stroke-dasharray="10 7" vector-effect="non-scaling-stroke"/>` : '') + extra;
}
async function fileToJpeg(file, max = 1280, q = 0.82) {
  const url = URL.createObjectURL(file);
  try { const img = await loadImage(url); return toJpeg(img, img.naturalWidth, img.naturalHeight, max, q); }
  finally { URL.revokeObjectURL(url); }
}

const NOCHANGE_LINES = ['No changes spotted yet. You\'ve got this!', 'Still looks the same from here. Try the next quick one.'];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const api = {
  get live() { return !!S.settings.workerUrl.trim(); },
  base() { return S.settings.workerUrl.trim().replace(/\/+$/, ''); },
  async call(path, body) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    try {
      const r = await fetch(this.base() + path, {
        method: 'POST', signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', 'X-App-Token': S.settings.token || '' },
        body: JSON.stringify(body)
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || `The AI helper answered with error ${r.status}.`);
      return j;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('The AI helper took too long to answer.');
      if (e instanceof TypeError) throw new Error('Couldn\'t reach the AI helper. Check its address in Settings.');
      throw e;
    } finally { clearTimeout(timer); }
  },
  async analyze(b64, room) {
    if (!this.live) {
      await wait(1600);
      return { summary: `Demo list for the ${room.toLowerCase()}. Connect your AI helper in Settings to get a list from your real photo.`, tasks: DEMO_TASKS.map((t) => ({ ...t })), demo: true };
    }
    return { ...(await this.call('/analyze', { image: b64, room, persona: personaId() })), demo: false };
  },
  async verify(beforeB64, afterB64, tasks) {
    if (!this.live) {
      await wait(1200);
      if (Math.random() < 0.75 && tasks.length) {
        const t = tasks[Math.floor(Math.random() * tasks.length)];
        return { done: [t.id], feedback: DEMO_LINES[Math.floor(Math.random() * DEMO_LINES.length)] };
      }
      return { done: [], feedback: NOCHANGE_LINES[Math.floor(Math.random() * NOCHANGE_LINES.length)] };
    }
    return this.call('/verify', { before: beforeB64 || null, after: afterB64, tasks, persona: personaId() });
  },
  async pushKey() {
    const r = await fetch(this.base() + '/push/key', { headers: { 'X-App-Token': S.settings.token || '' } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
    return j;
  },
  push(path, body) { return this.call(path, body); },
  async ask(body) {
    if (!this.live) {
      await wait(900);
      return { answer: 'In demo mode I can\'t really see your room. Connect your AI helper in Settings and I\'ll point things out for you!', zone: 'none', found: false };
    }
    return this.call('/ask', body);
  },
  async speak(text, voice) {
    const r = await fetch(this.base() + '/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Token': S.settings.token || '' },
      body: JSON.stringify({ text, voice })
    });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || `Voice error ${r.status}.`); }
    return r.arrayBuffer();
  },
  async voices() {
    const r = await fetch(this.base() + '/voices', { headers: { 'X-App-Token': S.settings.token || '' } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
    return j;
  },
  async health() {
    const r = await fetch(this.base() + '/health', { headers: { 'X-App-Token': S.settings.token || '' } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
    return j;
  }
};

/* ---------- focus area editor: tap points around the part of the view that counts ---------- */
function openAreaEditor({ src, w, h, mirror = false, initial = null, tip }) {
  return new Promise((resolve) => {
    let pts = (initial || []).map(([x, y]) => [mirror ? (1 - x) * w : x * w, y * h]);
    const ed = document.createElement('div');
    ed.className = 'area-ed'; ed.setAttribute('role', 'dialog'); ed.setAttribute('aria-label', 'Set focus area');
    ed.innerHTML = `<div class="tip">${esc(tip || 'Tap points around the part of the room to clean. Anything outside gets ignored.')}</div>
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet"><image href="${src}" width="${w}" height="${h}"/><g id="edDraw"></g></svg>
      <div class="row"><button class="btn" data-ed="undo">Undo</button><button class="btn" data-ed="clear">Clear</button><button class="btn" data-ed="whole">Whole view</button></div>
      <div class="row"><button class="btn" data-ed="cancel">Cancel</button><button class="btn primary" data-ed="save">Save area</button></div>`;
    document.body.appendChild(ed);
    const svg = ed.querySelector('svg'), g = ed.querySelector('#edDraw'), saveBtn = ed.querySelector('[data-ed=save]');
    const r = Math.max(w, h) / 60;
    const draw = () => {
      const d = pts.length ? 'M' + pts.map((p) => p.join(',')).join('L') + (pts.length >= 3 ? 'Z' : '') : '';
      g.innerHTML = (pts.length >= 3 ? `<path d="M0,0H${w}V${h}H0Z ${d}" fill="rgba(20,28,25,.55)" fill-rule="evenodd"/>` : '') +
        (d ? `<path d="${d}" fill="none" stroke="#FFD447" stroke-width="${r / 2.5}" stroke-linejoin="round"/>` : '') +
        pts.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i ? r * 0.7 : r}" fill="${i ? '#FFD447' : '#FF6F8E'}" stroke="#2D3B36" stroke-width="${r / 5}"/>`).join('');
      saveBtn.disabled = pts.length > 0 && pts.length < 3;
    };
    const finish = (val) => { ed.remove(); resolve(val); };
    svg.addEventListener('click', (e) => {
      const m = svg.getScreenCTM(); if (!m) return;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(m.inverse());
      if (p.x < 0 || p.y < 0 || p.x > w || p.y > h) return;
      pts.push([Math.round(p.x), Math.round(p.y)]); draw();
    });
    ed.addEventListener('click', (e) => {
      const b = e.target.closest('[data-ed]'); if (!b) return;
      const act = b.dataset.ed;
      if (act === 'undo') { pts.pop(); draw(); }
      else if (act === 'clear') { pts = []; draw(); }
      else if (act === 'whole') finish(null);
      else if (act === 'cancel') finish(undefined);
      else if (act === 'save') finish(pts.length >= 3 ? pts.map(([x, y]) => [+(mirror ? 1 - x / w : x / w).toFixed(4), +(y / h).toFixed(4)]) : null);
    });
    draw();
  });
}

async function enableReminders() {
  try {
    if (!mem.vapidKey) mem.vapidKey = (await api.pushKey()).key;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Reminders need notification permission.'); refreshNotifyBox(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    const want = b64uBytes(mem.vapidKey);
    if (sub && sub.options && sub.options.applicationServerKey) {
      const have = new Uint8Array(sub.options.applicationServerKey);
      if (have.length !== want.length || have.some((b, i) => b !== want[i])) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
    S.deviceId = S.deviceId || uid() + uid();
    await api.push('/push/subscribe', { id: S.deviceId, subscription: sub.toJSON(), tz: localTz(), prefs: notifyPrefs(), state: pushSummary() });
    S.notify.on = true; mem.pushSynced = ''; save();
    refreshNotifyBox(); toast('Reminders are on!', 'win');
  } catch (e) { toast(e.message || 'Couldn\'t turn on reminders. Try again.'); refreshNotifyBox(); }
}
async function disableReminders() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
  } catch (e) { /* already gone */ }
  if (S.deviceId && api.live) api.push('/push/unsubscribe', { id: S.deviceId }).catch(() => {});
  S.notify.on = false; save(); refreshNotifyBox(); toast('Reminders are off');
  if ('clearAppBadge' in navigator) navigator.clearAppBadge().catch(() => {});
}
function pushPrefs() {
  if (!S.notify.on || !S.deviceId || !api.live) return;
  api.push('/push/update', { id: S.deviceId, tz: localTz(), prefs: notifyPrefs() }).catch((e) => { if (/aren't set up/.test(e.message)) resubscribe(); });
}
async function resubscribe() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub || Notification.permission !== 'granted') { S.notify.on = false; save(); return; }
    await api.push('/push/subscribe', { id: S.deviceId, subscription: sub.toJSON(), tz: localTz(), prefs: notifyPrefs(), state: pushSummary() });
  } catch (e) { /* try again next time */ }
}
// Keep the helper's small summary (streak, open chores, weekly totals) current so reminders say the right thing.
let pushTimer = null;
function syncReminderState(now = false) {
  if (!S.notify.on || !S.deviceId || !api.live) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    const state = pushSummary();
    const key = JSON.stringify(state) + localTz();
    if (key === mem.pushSynced) return;
    api.push('/push/update', { id: S.deviceId, tz: localTz(), state })
      .then(() => { mem.pushSynced = key; })
      .catch((e) => { if (/aren't set up/.test(e.message)) resubscribe(); });
  }, now ? 0 : 20000);
}

/* Flash bonus: opened from a notification, double sparkles until the window ends. */
let flashTimer = null;
function flashTick() {
  const left = (S.flashUntil || 0) - Date.now();
  let bar = $('#flashBar');
  if (left <= 0) {
    clearInterval(flashTimer); flashTimer = null;
    if (bar) { bar.remove(); app.classList.remove('has-flash'); toast('Flash bonus is over. Nice hustle!'); }
    return;
  }
  if (!bar) { bar = document.createElement('div'); bar.id = 'flashBar'; bar.className = 'flash-bar'; bar.setAttribute('role', 'status'); document.body.appendChild(bar); }
  app.classList.add('has-flash');
  bar.textContent = `Flash bonus! Double sparkles for ${clockText(left)}`;
}
function startFlash() { if (!flashTimer) { flashTick(); flashTimer = setInterval(flashTick, 1000); } }
function handleDeepLink(href) {
  let u; try { u = new URL(href); } catch (e) { return; }
  const flash = Number(u.searchParams.get('flash'));
  if (flash > Date.now() && flash - Date.now() <= 60 * 60000 && flash !== S.flashUntil) {
    S.flashUntil = flash; save(); startFlash();
    toast('Flash bonus! Every chore earns double sparkles.', 'win');
  }
  const room = u.searchParams.get('room');
  if (room && roomById(room) && !C.el && S.players.length) { ui.view = 'room'; ui.roomId = room; mem.selected = null; render(); }

}

async function onPhoto(file) {
  if (!file) return;
  const room = roomById(ui.roomId);
  if (!room) return;
  if (photoMode === 'after') return checkWithPhoto(file, room);
  let area = null, full;
  try { full = await fileToJpeg(file, 1280, 0.82); } catch (e) { toast('Couldn\'t open that photo. Try another one.'); return; }
  const choice = await askFocusChoice(room, full.dataUrl);
  if (choice === 'cancel') return;
  if (choice === 'last') area = room.photoArea;
  if (choice === 'draw') {
    const el = await loadImage(full.dataUrl);
    const drawn = await openAreaEditor({ src: full.dataUrl, w: el.naturalWidth, h: el.naturalHeight, initial: room.photoArea, tip: 'Tap points around the part of the photo to clean. Anything outside gets ignored.' });
    if (drawn === undefined) return;
    area = drawn;
    room.photoArea = drawn || null; save();
  }
  busy('Taking a look…');
  try {
    const src = await loadImage(full.dataUrl);
    const img = area ? toJpeg(src, src.naturalWidth, src.naturalHeight, 1280, 0.82, area) : full;
    const res = await api.analyze(img.b64, room.name);
    const small = toJpeg(src, src.naturalWidth, src.naturalHeight, 768, 0.78, area);
    mem.before[room.id] = { dataUrl: full.dataUrl, small: small.b64, area };
    const prev = S.sessions[room.id];
    const kept = prev ? prev.tasks.filter((t) => t.done) : [];
    const tasks = (res.tasks || []).map((t) => ({ id: uid(), title: t.title, detail: t.detail || '', zone: ZONES.includes(t.zone) ? t.zone : null, points: clamp(Number(t.points) || 3, 1, 25), minutes: clamp(Number(t.minutes) || 0, 0, 90), category: t.category || 'other', done: false }));
    S.sessions[room.id] = { tasks: [...kept, ...tasks], summary: res.summary || '', createdAt: Date.now(), demo: !!res.demo, sweep: prev && kept.length ? prev.sweep && !tasks.length : false };
    if (!tasks.length) {
      setShine(room, Math.max(shineOf(room), 90));
      if (!kept.length) delete S.sessions[room.id];
      toast(res.summary || 'Looks tidy already!', 'win');
    }
    delete mem.lastFeedback[room.id];
    mem.selected = null;
    save();
  } catch (e) {
    toast(e.message || 'Something went wrong. Try again.');
  } finally { unbusy(); render(); }
}
function askFocusChoice(room, dataUrl) {

    openSheet(`<h2>Scan this photo?</h2>
      <div class="photo" style="margin-bottom:14px"><img src="${dataUrl}" alt="Your photo">${room.photoArea ? `<svg class="area-ov" viewBox="0 0 1 1" preserveAspectRatio="none">${areaOverlaySVG(room.photoArea)}</svg>` : ''}</div>

}
async function checkWithPhoto(file, room) {

}

  const actual = (C.stream.getVideoTracks()[0].getSettings() || {}).facingMode || facing;
  C.facing = facing;
  $('#cam').classList.toggle('mirror', actual === 'user');
  C.video.srcObject = C.stream;
  await C.video.play().catch(() => {});
  C.prev = null; C.motion = 0; C.activity = false; C.lastCheck = Date.now();
  C.video.addEventListener('loadedmetadata', refreshArea, { once: true });
  refreshArea();
}
/* Focus area in Coach Mode: saved per room and per camera, since the phone usually sits in the same spot. */
function coachArea() {
  const room = roomById(C.roomId);
  return room && room.coachArea ? room.coachArea[C.facing || 'environment'] || null : null;
}
function refreshArea() {
  const area = coachArea();
  C.mask = null;
  if (area) {
    // Which of the 48x36 motion-detector cells fall inside the area
    const m = new Uint8Array(48 * 36); let n = 0;
    for (let y = 0; y < 36; y++) for (let x = 0; x < 48; x++) {
      const px = (x + 0.5) / 48, py = (y + 0.5) / 36;
      let inside = false;
      for (let i = 0, j = area.length - 1; i < area.length; j = i++) {
        const [xi, yi] = area[i], [xj, yj] = area[j];
        if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
      }
      if (inside) { m[y * 48 + x] = 1; n++; }
    }
    if (n >= 20) { C.mask = m; C.maskCount = n; }
  }
  C.prev = null;
  renderCamOverlay();
}
function renderCamOverlay() {
  const ov = $('#camOverlay'); const v = C.video;
  if (!ov || !v || !v.videoWidth) return;
  const w = v.videoWidth, h = v.videoHeight;
  ov.setAttribute('viewBox', `0 0 ${w} ${h}`);
  let flash = '';
  if (C.flashZone && C.flashZone !== 'none' && Date.now() < C.flashUntil) {
    const i = ZONES.indexOf(C.flashZone);
    if (i > -1) flash = `<rect x="${(i % 3) * w / 3 + 6}" y="${Math.floor(i / 3) * h / 3 + 6}" width="${w / 3 - 12}" height="${h / 3 - 12}" rx="24" fill="rgba(138,211,240,.28)" stroke="#8AD3F0" stroke-width="8"/>`;
  }
  ov.innerHTML = areaOverlaySVG(coachArea(), w, h, flash);
}
function flashZone(zone) {
  C.flashZone = zone; C.flashUntil = Date.now() + 8000;
  renderCamOverlay();
  setTimeout(renderCamOverlay, 8100);
}
async function editCoachArea() {
  const v = C.video;
  if (!v || !v.videoWidth) return;
  const room = roomById(C.roomId);
  const mirror = $('#cam').classList.contains('mirror');
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const ctx = c.getContext('2d');
  if (mirror) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, 0, 0);
  const area = await openAreaEditor({ src: c.toDataURL('image/jpeg', 0.8), w: c.width, h: c.height, mirror, initial: coachArea(),
    tip: 'Tap points around the part of the room to clean. Fluff ignores everything outside it, from this phone spot.' });
  if (area === undefined) return;
  room.coachArea = room.coachArea || {};
  room.coachArea[C.facing || 'environment'] = area;
  save(); refreshArea();
  coachLine(area ? 'Got it! I\'ll only watch inside that area.' : 'Okay, I\'ll watch the whole view.', false);
}
async function flipCamera() {
  if (!C.el || C.flipping) return;
  C.flipping = true;
  const next = S.settings.camera === 'user' ? 'environment' : 'user';
  try {
    await openCamera(next);
    S.settings.camera = next; save();
    coachLine(next === 'user' ? 'Front camera on. Now you can see what I see!' : 'Back camera on.', false);
  } catch (e) {
    coachLine('I couldn\'t switch cameras. Trying the other one again.', false);
    try { await openCamera(S.settings.camera); } catch (err) { /* stays off */ }
  } finally { C.flipping = false; }
}
function renderCoachTasks() {
  const sess = S.sessions[C.roomId];
  const box = $('#cTasks');
  if (!box || !sess) return;
  const sorted = [...sess.tasks].sort((a, b) => a.done - b.done);
  box.innerHTML = sorted.map((t) => `<button class="ctask ${t.done ? 'done' : ''}" data-act="coach-toggle" data-id="${t.id}" aria-pressed="${t.done}"><span>${esc(t.title)}</span><span class="pts">${t.points}</span></button>`).join('');
  $('#cPts').textContent = C.pts;
}
function grabFrame(max, masked = true) {
  const v = C.video;
  return toJpeg(v, v.videoWidth, v.videoHeight, max, 0.8, masked ? coachArea() : null);
}
function setStatus(kind, text) {
  const key = kind + text;
  if (key === C.lastStatus) return;
  C.lastStatus = key;
  const d = $('#cDot'), s = $('#cStatus');
  if (d) d.className = 'dot ' + kind;
  if (s) s.textContent = text;
}
function coachTick() {
  if (document.hidden || !C.video || !C.video.videoWidth || !C.ctx) return;
  C.ctx.drawImage(C.video, 0, 0, 48, 36);
  const d = C.ctx.getImageData(0, 0, 48, 36).data;
  const g = new Uint8Array(48 * 36);
  let sum = 0;
  const mask = C.mask;
  for (let i = 0; i < g.length; i++) {
    g[i] = (d[i * 4] * 3 + d[i * 4 + 1] * 6 + d[i * 4 + 2]) / 10;
    if (C.prev && (!mask || mask[i])) sum += Math.abs(g[i] - C.prev[i]);
  }
  if (C.prev) C.motion = C.motion * 0.5 + (sum / (mask ? C.maskCount : g.length)) * 0.5;
  C.prev = g;
  const now = Date.now();
  if (C.motion > MOVE) { C.lastMotion = now; C.activity = true; C.activeMs += 200; C.nudges = 0; }
  else if (now - C.lastMotion > 5000) C.activeMs = 0;
  const gapLeft = Math.ceil((S.settings.minGap * 1000 - (now - C.lastCheck)) / 1000);
  if (C.checking) return setStatus('checking', 'Checking…');
  if (C.motion > MOVE) return setStatus('moving', 'You\'re working');
  if (C.activity && gapLeft > 0) return setStatus('', `Check in ${gapLeft}s`);
  if (C.activity && C.motion < CALM && now - C.lastMotion > SETTLE_MS) { runCheck(false); return; }
  if (C.activity) return setStatus('', 'Step back');
  setStatus('', 'Watching');
}
async function runCheck(manual, opts = {}) {
  const sess = S.sessions[C.roomId];
  if (C.checking || !sess || !C.video || !C.video.videoWidth) return;
  const open = sess.tasks.filter((t) => !t.done);
  if (!open.length) return;
  C.checking = true; C.activity = false; C.lastCheck = Date.now();
  setStatus('checking', 'Checking…');
  const after = grabFrame(960);
  const before = mem.before[C.roomId];
  try {
    const res = await api.verify(before ? before.small : null, after.b64, open.map((t) => ({ id: t.id, title: t.title, zone: t.zone })));
    if (!C.el) return;
    const r = applyVerify(C.roomId, res, 'coach');
    if (opts.silent) {
      if (r.count) { C.pts += r.pts; pop(`+${r.pts} ✦`); }
      renderCoachTasks();
      return r;
    }
    if (r.count) {
      C.pts += r.pts;
      pop(`+${r.pts} ✦`); chime(); coachFluff(true);
      coachLine(res.feedback || line('nice'));
      pepAfterAward();
      challengeOnAward();
    } else if (manual) {
      coachLine(res.feedback || line('noChange'));
    } else if (res.feedback) {
      coachLine(res.feedback, false);
    }
    renderCoachTasks();
    if (sess.tasks.every((t) => t.done)) coachDone();
  } catch (e) {
    if (C.el) coachLine('I couldn\'t reach the AI helper. I\'ll try again on the next check.', false);
  } finally { C.checking = false; C.lastCheck = Date.now(); C.lastStatus = ''; }
}
function coachDone() {
  coachFluff(true);
  const afterChallenge = Date.now() - (C.challengeEndedAt || 0) < 3000;
  setTimeout(() => coachLine(line('done', { pts: C.pts })), afterChallenge ? 6500 : 1200);
  const row = C.el.querySelector('.bottom .row');
  row.innerHTML = '<button class="btn sun" data-act="coach-end">Finish</button>';
}
async function wakeOn() {
  try { if ('wakeLock' in navigator && !document.hidden) C.wake = await navigator.wakeLock.request('screen'); } catch (e) { /* not supported */ }
}
function stopCoach() {
  resetChallenge();
  clearInterval(C.loop); clearInterval(C.clock);
  if (C.stream) C.stream.getTracks().forEach((t) => t.stop());
  if (C.wake) { C.wake.release().catch(() => {}); C.wake = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (C.el) C.el.remove();
  Object.assign(C, { el: null, stream: null, video: null, ctx: null });
  render();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && C.el) { wakeOn(); C.prev = null; C.lastCheck = Date.now(); }
});

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch (act) {
    case 'tab': ui.view = a.dataset.view; mem.selected = null; window.scrollTo(0, 0); render(); break;
    case 'home': ui.view = 'home'; mem.selected = null; window.scrollTo(0, 0); render(); break;
    case 'room': ui.view = 'room'; ui.roomId = id; mem.selected = null; window.scrollTo(0, 0); render(); break;
    case 'photo': askPhoto(a.dataset.src, a.dataset.mode === 'after' ? 'after' : 'before'); break;
    case 'select': {
      mem.selected = mem.selected === id ? null : id;
      render();
      break;
    }
    case 'zone': {
      const sess = S.sessions[ui.roomId];
      const t = sess.tasks.find((x) => x.zone === a.dataset.zone && !x.done);
      if (t) { mem.selected = t.id; render(); const li = app.querySelector(`.task[data-id="${t.id}"]`); if (li) li.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); }
      break;
    }
    case 'toggle': {
      e.stopPropagation();
      const sess = S.sessions[ui.roomId];
      const t = sess.tasks.find((x) => x.id === id);
      if (!t) break;
      unlockAudio();
      if (t.done) { undoTask(ui.roomId, t); }
      else { const g = awardTask(ui.roomId, t, 'hand'); pop(`+${g} ✦`); chime(); }
      render();
      break;
    }
    case 'coach': startCoach(ui.roomId); break;
    case 'coach-end': stopCoach(); break;
    case 'coach-check': unlockAudio(); runCheck(true); break;
    case 'coach-flip': flipCamera(); break;
    case 'coach-area': editCoachArea(); break;
    case 'sync-setup': runSyncSetup('auto'); break;
    case 'sync-join': runSyncSetup('join'); break;
    case 'sync-merge': runSyncSetup('merge'); break;
    case 'sync-now': SY.backoff = 0; syncNow(); break;
    case 'sync-off': stopSync(); break;
    case 'pick-persona': {
      const p = player();
      if (!p || !PERSONAS[id]) break;
      p.persona = id; save();
      $('#personaGrid').innerHTML = personaCards();
      const hi = LINES[id].hello[0];
      $('#personaHello').textContent = `${PERSONAS[id].name}: “${hi}”`;
      unlockAudio(); say(hi);
      pushPrefs(); render();
      break;
    }
    case 'notify-on': enableReminders(); break;
    case 'notify-off': disableReminders(); break;
    case 'notify-test': {
      if ($('#nDailyOn')) { readNotifyForm(); save(); pushPrefs(); }
      api.push('/push/test', { id: S.deviceId }).then(() => toast('Test sent. It should arrive in a few seconds.'))
        .catch((e) => { toast(e.message); if (/expired|aren't set up/.test(e.message)) { S.notify.on = false; save(); refreshNotifyBox(); } });
      break;
    }
    case 'ask': openAsk(); break;
    case 'ask-task': e.stopPropagation(); openAsk(id); break;
    case 'ask-send': sendAsk($('#askQ').value, id || null); break;
    case 'ask-chip': $('#askQ').value = a.dataset.q; sendAsk(a.dataset.q, id || null); break;
    case 'ask-mic': toggleMic(a); break;
    case 'ask-remove': {
      const rid = askRoomId(); const sess = S.sessions[rid];
      const t = sess && sess.tasks.find((x) => x.id === id);
      if (t) { if (t.done) undoTask(rid, t); sess.tasks = sess.tasks.filter((x) => x.id !== id); mem.selected = null; save(); }
      closeSheet(); toast('Chore removed'); if (C.el) renderCoachTasks(); render();
      break;
    }
    case 'ask-done': {
      const rid = askRoomId(); const sess = S.sessions[rid];
      const t = sess && sess.tasks.find((x) => x.id === id);
      closeSheet();
      if (t && !t.done) { const g = awardTask(rid, t, 'hand'); if (C.el) { C.pts += g; renderCoachTasks(); } pop(`+${g} ✦`); chime(); }
      render();
      break;
    }
    case 'ch-open': if (CH.active) { resetChallenge(); coachLine(line('stopped'), false); } else openChallengePicker(); break;
    case 'ch-start': closeSheet(); startChallenge('blitz', Number(a.dataset.sec)); break;
    case 'ch-start-custom': {
      const n = Number($('#chNum').value), unit = Number($('#chUnit').value);
      if (!(n > 0)) { $('#chNum').focus(); break; }
      closeSheet(); startChallenge('blitz', n * unit);
      break;
    }
    case 'clock-from-room': startCoach(ui.roomId).then(() => { if (C.el) openChallengePicker(); }); break;
    case 'coach-toggle': {
      const sess = S.sessions[C.roomId];
      const t = sess && sess.tasks.find((x) => x.id === id);
      if (!t) break;
      if (t.done) { if (t.how === 'hand') { C.pts = Math.max(0, C.pts - t.points); undoTask(C.roomId, t); } }
      else { const g = awardTask(C.roomId, t, 'hand'); C.pts += g; pop(`+${g} ✦`); chime(); coachFluff(true); pepAfterAward(); challengeOnAward(); }
      renderCoachTasks();
      if (sess.tasks.every((x) => x.done)) coachDone();
      break;
    }
    case 'add-task': openAddTask(); break;
    case 'save-task': {
      const title = $('#tTitle').value.trim();
      if (!title) { $('#tTitle').focus(); break; }
      const sess = S.sessions[ui.roomId];
      sess.tasks.push({ id: uid(), title, detail: '', zone: null, points: Number($('#tPts').value), minutes: 0, category: 'other', done: false });
      sess.sweep = false;
      save(); closeSheet(); render();
      break;
    }
    case 'edit-task': e.stopPropagation(); openEditTask(id); break;
    case 'update-task': {
      const t = S.sessions[ui.roomId].tasks.find((x) => x.id === id);
      const title = $('#tTitle').value.trim();
      if (!t) { closeSheet(); break; }
      if (!title) { $('#tTitle').focus(); break; }
      t.title = title;
      t.detail = $('#tDetail').value.trim();
      if (!t.done) t.points = Number($('#tPts').value);
      save(); closeSheet(); render();
      break;
    }
    case 'delete-task': {
      e.stopPropagation();
      const sess = S.sessions[ui.roomId];
      const t = sess.tasks.find((x) => x.id === id);
      if (!t) break;
      if (!confirm(t.done ? `Delete "${t.title}"? The ${t.points} sparkles it earned will be taken back.` : `Delete "${t.title}"?`)) break;
      if (t.done) undoTask(ui.roomId, t);
      sess.tasks = sess.tasks.filter((x) => x.id !== id);
      mem.selected = null;
      save(); render();
      toast('Task deleted');
      break;
    }
    case 'finish': openFinish(); break;
    case 'clear-list': {
      const room = roomById(ui.roomId);
      const sess = S.sessions[room.id];
      if (sess && sess.tasks.every((t) => t.done)) setShine(room, 100);
      delete S.sessions[room.id]; delete mem.before[room.id]; delete mem.lastFeedback[room.id];
      save(); closeSheet(); ui.view = 'home'; render();
      break;
    }
    case 'close-sheet': closeSheet(); break;
    case 'players': openPlayers(); break;
    case 'pick-player': S.current = id; save(); closeSheet(); render(); break;
    case 'add-player': {
      const name = $('#newPlayer').value.trim();
      if (!name) { $('#newPlayer').focus(); break; }
      const p = { id: uid(), name, color: PLAYER_COLORS[S.players.length % PLAYER_COLORS.length], sparkles: 0, created: Date.now() };
      S.players.push(p); S.current = p.id; save(); closeSheet(); render();
      break;
    }
    case 'welcome-go': {
      const name = $('#wName').value.trim();
      if (!name) { $('#wName').focus(); break; }
      const p = { id: uid(), name, color: PLAYER_COLORS[0], sparkles: 0, created: Date.now() };
      S.players = [p]; S.current = p.id; save(); closeSheet(); render();
      break;
    }
    case 'settings': openSettings(); break;
    case 'test-helper': {
      const st = $('#sStatus');
      S.settings.workerUrl = $('#sUrl').value.trim(); S.settings.token = $('#sToken').value.trim();
      if (!api.live) { st.innerHTML = '<div class="status bad">Add the helper address first.</div>'; break; }
      st.innerHTML = '<div class="status">Testing…</div>';
      api.health().then(() => { st.innerHTML = '<div class="status ok">Connected. Fluff can see your photos now.</div>'; save(); })
        .catch((err) => { st.innerHTML = `<div class="status bad">${esc(err.message === 'Failed to fetch' || err instanceof TypeError ? 'Couldn\'t reach that address.' : err.message)}</div>`; });
      break;
    }
    case 'save-settings': {
      S.settings.workerUrl = $('#sUrl').value.trim();
      S.settings.token = $('#sToken').value.trim();
      S.settings.minGap = Number($('#sGap').value);
      S.settings.pep = $('#sPep').value;
      S.settings.sound = $('#sSound').checked;
      S.settings.voice = $('#sVoice').checked;
      if ($('#sVoiceId')) S.settings.voiceId = $('#sVoiceId').value;
      if ($('#nDailyOn')) { readNotifyForm(); if (S.notify.on) pushPrefs(); }
      AI.failedNote = false;
      save(); closeSheet(); toast('Settings saved'); render(); loadAiVoices();
      break;
    }
    case 'test-voice': {
      unlockAudio();
      const id = $('#sVoiceId') ? $('#sVoiceId').value : '';
      const ai = id.startsWith('el:') && AI.voices.find((v) => 'el:' + v.id === id);
      if (ai && ai.preview) { const a = $('#previewAudio'); a.src = ai.preview; a.play().catch(() => say('Hi! I\'m Fluff. Let\'s make this room sparkle!', id)); }
      else say('Hi! I\'m Fluff. Let\'s make this room sparkle!', id);
      break;
    }
    case 'add-room': openAddRoom(); break;
    case 'save-room': {
      const name = $('#rName').value.trim();
      if (!name) { $('#rName').focus(); break; }
      S.rooms.push({ id: uid(), name, emoji: $('#sheet').dataset.emo || '🏠', shine: 50, shineAt: Date.now(), created: Date.now() });
      save(); closeSheet(); render();
      break;
    }
    case 'del-room': {
      const r = roomById(id);
      if (r && confirm(`Remove the ${r.name}? Its chore list goes too.`)) {
        S.rooms = S.rooms.filter((x) => x.id !== id); delete S.sessions[id];
        save(); openSettings(); render();
      }
      break;
    }
    case 'reset': {
      if (confirm('Reset everything? This clears all players, sparkles, rooms and lists on this phone.')) {
        try { localStorage.removeItem(STORE_KEY); } catch (err) { /* ignore */ }
        S = fresh(); closeSheet(); ui = { view: 'home', roomId: null }; render();
      }
      break;
    }
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#sheet') && S.players.length) closeSheet();
  if (e.key === 'Enter' && e.target.matches('#wName')) $('[data-act="welcome-go"]').click();
  if (e.key === 'Enter' && e.target.matches('#newPlayer')) $('[data-act="add-player"]').click();
  if (e.key === 'Enter' && e.target.matches('#tTitle')) $('[data-act="save-task"]').click();
  if (e.key === 'Enter' && e.target.matches('#rName')) $('[data-act="save-room"]').click();
  if (e.key === 'Enter' && e.target.matches('#askQ')) $('[data-act="ask-send"]').click();
});

render();
loadAiVoices();
handleDeepLink(location.href);
if (Date.now() < (S.flashUntil || 0)) startFlash();
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'open') handleDeepLink(e.data.url); });
if (S.notify.on && pushSupported() && Notification.permission !== 'granted') { S.notify.on = false; save(); }
updateBadge();
syncReminderState(true);
if (SY.on) syncNow();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
